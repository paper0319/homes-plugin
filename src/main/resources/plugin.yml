name: homes
version: ${project.version}
main: com.example.homes.HomesPlugin
api-version: "1.21"
author: paper
website: https://github.com/paper0319/homes-plugin
commands:
  home:
    description: ホームにテレポートする
    usage: /home <名前>
  homes:
    description: ホーム画面(GUI)を開く
    usage: /homes [list]
  sethome:
    description: ホームを設定する
    usage: /sethome <名前>
  delhome:
    description: ホームを削除する
    usage: /delhome <名前>
  vhome:
    description: 他のプレイヤーの公開ホームを訪問する
    usage: /vhome <プレイヤー名>
permissions:
  homes.admin:
    description: 他人のホームを閲覧・管理する権限
    default: op
  homes.reload:
    description: /homes reload で設定を再読み込みする権限
    default: op
  # ホーム数の個別上限。LuckPerms 等で付与して使います:
  #   homes.limit.<数字>    例: homes.limit.10 で最大10個
  #   homes.limit.unlimited 無制限
  # default: false なので、付与しなければ settings.default-home-limit が適用されます (OPも同様)。
  homes.limit.unlimited:
    description: ホーム数を無制限にする
    default: false
  homes.limit.*:
    description: ホーム数を無制限にする (homes.limit.unlimited と同等)
    default: false
  # テレポート/経済の bypass。既定で OP が保持し、LuckPerms 等で付与・剥奪できます。
  homes.bypass.teleportdelay:
    description: テレポートの待機時間(ウォームアップ)を無視して即時テレポートする
    default: op
  homes.bypass.economy:
    description: ホーム機能の利用料金を無料にする
    default: op
  # vanish (SuperVanish/PremiumVanish 等) 中のプレイヤーは TPA 一覧・補完・対象から除外されます。
  # この権限を持つ者 (既定で OP) には vanish 中の相手も見え、TPA できます。
  homes.tpa.seehidden:
    description: vanish 中のプレイヤーも TPA の対象として見える
    default: op
  homes.setspawn:
    description: スポーン地点を設定できる
    default: op
